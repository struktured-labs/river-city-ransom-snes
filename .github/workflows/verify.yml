name: Verify foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audit test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Build pinned dependencies
        run: make bootstrap
      - name: Assemble diagnostic and verify data conversion
        run: make verify
      - name: Verify checked-in audit integrity and honest pass/fail status
        run: |
          python3 tools/verify_audit.py docs/audit/renderer
          python3 tools/verify_audit.py docs/audit/live
          python3 tools/verify_audit.py docs/audit/incremental
          node tools/check_review_ui.mjs
      - name: Build pinned instrumented emulator
        run: python3 tools/bootstrap_core.py
      - name: Verify real SNES execution and SPC sound without commercial assets
        run: python3 tools/smoke_libretro.py --core .deps/snes9x/libretro/snes9x_libretro.so
      - name: Exercise native PPU and CPU register ABI without commercial assets
        run: python3 tools/check_adapter.py --core .deps/snes9x/libretro/snes9x_libretro.so
      - name: Verify incremental producer, bounded NMI and exact synthetic pixels
        run: python3 tools/check_video.py --core .deps/snes9x/libretro/snes9x_libretro.so
