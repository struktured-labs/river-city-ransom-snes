MEMORY { ROM: start=$7000,size=$9000,file=%O,fill=yes,fillval=$FF; }
SEGMENTS {
 HELPER: load=ROM,type=ro,start=$7C00;
 CODE: load=ROM,type=ro,start=$8000;
 HOOK: load=ROM,type=ro,start=$DF00;
 ORIGINAL: load=ROM,type=ro,start=$DFE2;
 HEADER: load=ROM,type=ro,start=$FFC0;
 VECTORS: load=ROM,type=ro,start=$FFE0;
}
