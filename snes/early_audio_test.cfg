MEMORY { ROM: start = $008000, size = $8000, file = %O, fill = yes, fillval = $EA; }
SEGMENTS {
    CODE: load = ROM, type = ro;
    DRIVER: load = ROM, type = ro, start = $00FA54;
    RESTORE: load = ROM, type = ro, start = $00FF29;
    HEADER: load = ROM, type = ro, start = $00FFC0;
    VECTORS: load = ROM, type = ro, start = $00FFE0;
}
