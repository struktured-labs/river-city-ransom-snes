MEMORY { ROM: start=$8000,size=$8000,file=%O,fill=yes,fillval=$FF; }
SEGMENTS {
 CODE: load=ROM,type=ro,start=$8000;
 ORIGINAL: load=ROM,type=ro,start=$AA9C;
 CHANGED: load=ROM,type=ro,start=$AAB7;
 MATCH: load=ROM,type=ro,start=$AB20;
 HOOK: load=ROM,type=ro,start=$AB80;
 HELPER: load=ROM,type=ro,start=$D300;
 HEADER: load=ROM,type=ro,start=$FFC0;
 VECTORS: load=ROM,type=ro,start=$FFE0;
}
