MEMORY { ROM: start=$7000,size=$9000,file=%O,fill=yes,fillval=$FF; }
SEGMENTS {
 WAIT: load=ROM,type=ro,start=$7B00;
 CODE: load=ROM,type=ro,start=$8500;
 LOGGER: load=ROM,type=ro,start=$E000;
 IDLE: load=ROM,type=ro,start=$E400;
 FINISH: load=ROM,type=ro,start=$F2D0;
 HEADER: load=ROM,type=ro,start=$FFC0;
 VECTORS: load=ROM,type=ro,start=$FFE0;
}
