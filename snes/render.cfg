MEMORY {
    ROM0: start = $008000, size = $8000, file = %O, fill = yes, fillval = $FF;
    ROM1: start = $018000, size = $8000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    CODE: load = ROM0, type = ro;
    HEADER: load = ROM0, type = ro, start = $00FFC0;
    VECTORS: load = ROM0, type = ro, start = $00FFE0;
    ASSETS: load = ROM1, type = ro;
}
